<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0ea5e9" />
    <title>Connectify — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #09090b;
        color: #fafafa;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      img {
        width: 6rem;
        height: 6rem;
      }
      p {
        color: #a1a1aa;
        line-height: 1.6;
      }
      button {
        margin-top: 0.75rem;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.75rem 1.25rem;
        background: #0ea5e9;
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/icon-192x192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Connectify will reconnect and load your messages when your internet connection returns.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
